name: Schedule today's YouTube Short
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST: uploads today's video and schedules it for 19:30 IST
  workflow_dispatch:
    inputs:
      date: {description: "Post date YYYY-MM-DD (blank = today in India)", required: false}
permissions:
  contents: write
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scripts/youtube_schedule.py
        env:
          POST_DATE: ${{ inputs.date }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Save what was posted
        run: |
          git config user.name "autopost-bot"; git config user.email "autopost@users.noreply.github.com"
          git add posts/*/done.json || true
          git commit -m "YouTube scheduled $(date -u +%F)" || echo "nothing to commit"
          git push || true
